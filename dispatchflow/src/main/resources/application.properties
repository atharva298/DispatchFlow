spring.application.name=dispatchflow
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dispatchflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dispatchflow}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
dispatchflow.jwt.secret=${JWT_SECRET}
dispatchflow.jwt.issuer=${JWT_ISSUER:dispatchflow}
dispatchflow.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}
