services:
  api:
    image: dispatchflow-api:${DISPATCHFLOW_IMAGE_TAG:-0.0.1-SNAPSHOT}
    build:
      context: ./dispatchflow
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dispatchflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dispatchflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or the shell environment}
      JWT_ISSUER: ${JWT_ISSUER:-dispatchflow}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-900}
      SPRING_DATA_REDIS_HOST: redis
      DISPATCHFLOW_RATE_LIMIT_REQUESTS_PER_WINDOW: ${DISPATCHFLOW_RATE_LIMIT_REQUESTS_PER_WINDOW:-100}
      DISPATCHFLOW_RATE_LIMIT_WINDOW_SECONDS: ${DISPATCHFLOW_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "${DISPATCHFLOW_API_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: dispatchflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dispatchflow}
      POSTGRES_USER: ${POSTGRES_USER:-dispatchflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell environment}
    ports:
      - "5432:5432"
    volumes:
      - dispatchflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dispatchflow} -d ${POSTGRES_DB:-dispatchflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.11-alpine3.21
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  dispatchflow-postgres-data:
